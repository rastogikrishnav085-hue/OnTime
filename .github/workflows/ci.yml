name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows is in the matrix on purpose: the original model pickle failed to load there.
        os: [ubuntu-latest, windows-latest]
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-app.txt
      - name: Install
        run: python -m pip install -r requirements-app.txt
      - name: Run the test suite
        run: python -m pytest tests -q -p no:warnings

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build -t ontime:ci .
      - name: Start and check the app answers
        run: |
          docker run -d --name ontime -p 8000:8000 ontime:ci
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8000/api/health >/dev/null; then break; fi
            sleep 2
          done
          curl -sf http://localhost:8000/api/health >/dev/null || { docker logs ontime; exit 1; }
          docker exec ontime python scripts/http_smoke_test.py http://127.0.0.1:8000
          docker logs ontime
